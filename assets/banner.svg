<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="100%" height="100%">
  <defs>
    <!-- Dark Cyber Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#0a1020" />
      <stop offset="100%" stop-color="#04060c" />
    </linearGradient>

    <linearGradient id="neonCyanPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.5" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.8" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .title { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-size: 52px; font-weight: 900; letter-spacing: 8px; fill: url(#neonCyanPurple); }
    .subtitle { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-size: 15px; font-weight: 600; letter-spacing: 4px; fill: #94a3b8; text-transform: uppercase; }
    .tag { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 13px; font-weight: 600; fill: #38bdf8; }
    .metric-val { font-family: 'Segoe UI', -apple-system, sans-serif; font-size: 24px; font-weight: 800; fill: #ffffff; }
    .metric-label { font-family: 'Segoe UI', -apple-system, sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 1.5px; fill: #64748b; text-transform: uppercase; }
    .watermark { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 500; fill: #475569; letter-spacing: 2px; }
  </style>

  <!-- Background Base -->
  <rect width="900" height="340" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Background Grid Pattern -->
  <g stroke="#1e293b" stroke-width="0.75" opacity="0.35">
    <line x1="0" y1="60" x2="900" y2="60" />
    <line x1="0" y1="120" x2="900" y2="120" />
    <line x1="0" y1="180" x2="900" y2="180" />
    <line x1="0" y1="240" x2="900" y2="240" />
    <line x1="150" y1="0" x2="150" y2="340" />
    <line x1="300" y1="0" x2="300" y2="340" />
    <line x1="450" y1="0" x2="450" y2="340" />
    <line x1="600" y1="0" x2="600" y2="340" />
    <line x1="750" y1="0" x2="750" y2="340" />
  </g>

  <!-- Ambient Glow Orbs -->
  <circle cx="120" cy="80" r="100" fill="#38bdf8" opacity="0.08" filter="url(#glow)" />
  <circle cx="780" cy="180" r="140" fill="#a855f7" opacity="0.08" filter="url(#glow)" />

  <!-- Top System Status Bar -->
  <g transform="translate(45, 42)">
    <circle cx="6" cy="6" r="4.5" fill="#10b981" filter="url(#subtleGlow)">
      <animate attributeName="opacity" values="1;0.4;1" dur="2.5s" repeatCount="indefinite" />
    </circle>
    <text x="20" y="10" class="tag">DARKSIDE KERNEL v4.2 // SYSTEM: OPERATIONAL</text>
    <text x="810" y="10" text-anchor="end" class="watermark">UID: 93755320 • GALLE, LK 🇱🇰</text>
  </g>

  <!-- Main Hero Branding -->
  <g transform="translate(45, 125)">
    <text x="0" y="0" class="title" filter="url(#subtleGlow)">DARKWINZO</text>
    <text x="0" y="32" class="subtitle">FULL-STACK BOT ARCHITECT • FOUNDER @ DARKSIDE DEVELOPER TEAM</text>
  </g>

  <!-- Telemetry Metric Cards -->
  <g transform="translate(45, 205)">
    <!-- Card 1: Bot Forks -->
    <g transform="translate(0, 0)">
      <rect width="250" height="75" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <circle cx="32" cy="37" r="16" fill="#0284c7" opacity="0.2" />
      <path d="M 32 28 L 32 35 M 32 35 L 27 41 M 32 35 L 37 41" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" fill="none" />
      <text x="60" y="36" class="metric-val">1,350+</text>
      <text x="60" y="55" class="metric-label">COMMUNITY BOT FORKS</text>
    </g>

    <!-- Card 2: GitHub Stars -->
    <g transform="translate(280, 0)">
      <rect width="250" height="75" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <circle cx="32" cy="37" r="16" fill="#f59e0b" opacity="0.2" />
      <polygon points="32,27 34.5,33 41,33.5 36,37.5 37.8,44 32,40 26.2,44 28,37.5 23,33.5 29.5,33" fill="#fbbf24" />
      <text x="60" y="36" class="metric-val">210+ STARS</text>
      <text x="60" y="55" class="metric-label">OPEN-SOURCE APPRECIATION</text>
    </g>

    <!-- Card 3: Flagship Systems -->
    <g transform="translate(560, 0)">
      <rect width="250" height="75" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <circle cx="32" cy="37" r="16" fill="#8b5cf6" opacity="0.2" />
      <path d="M 25 43 L 25 33 L 32 27 L 39 33 L 39 43 Z" stroke="#c084fc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      <text x="60" y="36" class="metric-val">QUEEN ECOSYSTEM</text>
      <text x="60" y="55" class="metric-label">QUEEN-MD • QUEEN-AI • COLT</text>
    </g>
  </g>

  <!-- Bottom Terminal Status Bar -->
  <g transform="translate(45, 315)">
    <text x="0" y="0" class="watermark">📍 GALLE [6.0535° N, 80.2210° E] • SPECIALITY: WHATSAPP PROTOCOLS, HIGH-CONCURRENCY AUTOMATION & AI AGENTS</text>
  </g>
</svg>
